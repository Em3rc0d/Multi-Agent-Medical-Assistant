name: EAK CI

on:
  push:
    branches:
      - eak/mk1-contract-first
    paths:
      - "eak/**"
      - ".github/workflows/eak-ci.yml"
  pull_request:
    paths:
      - "eak/**"
      - ".github/workflows/eak-ci.yml"

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install EAK kernel with LangGraph integration
        run: python -m pip install -e './eak/kernel[test,langgraph]'
      - name: Python source compile check
        run: python -m compileall -q eak/kernel/src
      - name: Schema meta-validation
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          for path in sorted(Path('eak/kernel/schemas/v0.2').glob('*.schema.json')):
              Draft202012Validator.check_schema(json.loads(path.read_text()))
              print(f'validated {path}')
          PY
      - name: Kernel and LangGraph integration tests
        run: python -m pytest eak/kernel/tests -ra
