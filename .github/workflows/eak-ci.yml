name: EAK CI

on:
  push:
    branches:
      - main
      - dev
      - 'eak/**'
    paths:
      - "eak/**"
      - ".github/workflows/eak-ci.yml"
  pull_request:
    paths:
      - "eak/**"
      - ".github/workflows/eak-ci.yml"

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install EAK kernel with LangGraph integration
        run: python -m pip install -e './eak/kernel[test,langgraph]'
      - name: Install generic provider incubation package
        run: python -m pip install -e './eak/providers[test]'
      - name: Install medical Domain Pack adapters
        run: python -m pip install -e './eak/domains/medical[test]'
      - name: Dependency consistency
        run: python -m pip check
      - name: Python source compile check
        run: |
          python -m compileall -q eak/kernel/src
          python -m compileall -q eak/providers/src
          python -m compileall -q eak/domains/medical/src
      - name: Schema meta-validation
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          paths = sorted(Path('eak/kernel/schemas/v0.2').glob('*.schema.json'))
          assert len(paths) == 10, f'Expected 10 schema documents, got {len(paths)}'
          for path in paths:
              Draft202012Validator.check_schema(json.loads(path.read_text()))
              print(f'validated {path}')
          PY
      - name: Kernel and LangGraph integration tests
        run: python -m pytest eak/kernel/tests -ra
      - name: Provider boundary tests
        run: python -m pytest eak/providers/tests -ra
      - name: Domain pack manifest tests
        run: python -m pytest eak/domains/tests -ra
      - name: Medical Quarry adapter tests
        run: python -m pytest eak/domains/medical/tests -ra
      - name: Cross-domain compiler conformance
        run: eak-conformance --root eak/kernel
