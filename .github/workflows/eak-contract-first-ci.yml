name: EAK Contract-First CI

on:
  push:
    branches:
      - 'eak/**'
    paths:
      - 'eak/**'
      - '.github/workflows/eak-contract-first-ci.yml'
  pull_request:
    paths:
      - 'eak/**'
      - '.github/workflows/eak-contract-first-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Reassemble and validate MK1 snapshot transport
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/eak-mk1
          cat eak/artifacts/mk1-contract-first/eak-mk1-clean.tar.xz.b64.part* \
            | base64 --decode > /tmp/eak-mk1.tar.xz
          echo 'Transport archive digest:'
          sha256sum /tmp/eak-mk1.tar.xz
          echo 'Validating xz/tar structure...'
          tar -tJf /tmp/eak-mk1.tar.xz >/dev/null
          tar -xJf /tmp/eak-mk1.tar.xz -C /tmp/eak-mk1

      - name: Install EAK with LangGraph integration
        run: python -m pip install -e '/tmp/eak-mk1[test,langgraph]'

      - name: Run EAK contract and cross-domain tests
        working-directory: /tmp/eak-mk1
        run: python -m pytest

      - name: Run real LangGraph pause/resume smoke test
        run: python eak/ci/langgraph_integration_smoke.py

      - name: Verify no domain branches leaked into kernel core
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE "if[[:space:]]+.*domain.*(medical|legal|aec)|elif[[:space:]]+.*domain.*(medical|legal|aec)" /tmp/eak-mk1/src/eak_kernel; then
            echo 'Domain-specific branching leaked into EAK Kernel Core.' >&2
            exit 1
          fi
          echo 'Domain-switch scan: PASS'
