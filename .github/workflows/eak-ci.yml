name: EAK CI

on:
  push:
    branches:
      - eak/mk1-contract-first
  pull_request:
    paths:
      - "eak/**"
      - ".github/workflows/eak-ci.yml"

permissions:
  contents: read

jobs:
  snapshot-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose frozen snapshot transport
        shell: bash
        run: |
          set +e
          : > /tmp/eak-diagnostics.txt
          echo "== files ==" >> /tmp/eak-diagnostics.txt
          wc -c eak/artifacts/mk1-contract-first/eak-mk1-clean.tar.xz.b64.part* >> /tmp/eak-diagnostics.txt 2>&1
          echo "== decode ==" >> /tmp/eak-diagnostics.txt
          cat eak/artifacts/mk1-contract-first/eak-mk1-clean.tar.xz.b64.part* | base64 -d > /tmp/eak-mk1-clean.tar.xz 2>> /tmp/eak-diagnostics.txt
          echo "decode_exit=$?" >> /tmp/eak-diagnostics.txt
          echo "== sha256 ==" >> /tmp/eak-diagnostics.txt
          sha256sum /tmp/eak-mk1-clean.tar.xz >> /tmp/eak-diagnostics.txt 2>&1
          echo "== xz ==" >> /tmp/eak-diagnostics.txt
          xz -t /tmp/eak-mk1-clean.tar.xz >> /tmp/eak-diagnostics.txt 2>&1
          echo "xz_exit=$?" >> /tmp/eak-diagnostics.txt
          echo "== tar ==" >> /tmp/eak-diagnostics.txt
          tar -tJf /tmp/eak-mk1-clean.tar.xz >> /tmp/eak-diagnostics.txt 2>&1
          echo "tar_exit=$?" >> /tmp/eak-diagnostics.txt
          cat /tmp/eak-diagnostics.txt
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: eak-snapshot-diagnostics
          path: /tmp/eak-diagnostics.txt

  kernel:
    needs: snapshot-diagnostics
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Reconstruct frozen MK1 base snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat eak/artifacts/mk1-contract-first/eak-mk1-clean.tar.xz.b64.part* | base64 -d > /tmp/eak-mk1-clean.tar.xz
          xz -t /tmp/eak-mk1-clean.tar.xz
          mkdir -p /tmp/eak-src
          tar -xJf /tmp/eak-mk1-clean.tar.xz -C /tmp/eak-src
      - name: Apply MK1 RC1 delta
        shell: bash
        run: |
          set -euo pipefail
          cat eak/artifacts/mk1-rc1/eak-mk1-rc1.patch.part* > /tmp/eak-mk1-rc1.patch
          cd /tmp/eak-src
          patch -p1 < /tmp/eak-mk1-rc1.patch
      - name: Install EAK with LangGraph runtime
        run: python -m pip install -e '/tmp/eak-src[test,langgraph]'
      - name: Contract and runtime conformance
        run: python -m pytest /tmp/eak-src/tests -ra
      - name: Cross-domain compiler conformance
        run: eak-conformance --root /tmp/eak-src
