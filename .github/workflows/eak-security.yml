name: EAK Supply Chain

on:
  push:
    branches:
      - main
      - dev
      - 'eak/**'
    paths:
      - 'eak/kernel/**'
      - 'eak/providers/**'
      - 'eak/domains/**'
      - '.github/workflows/eak-security.yml'
  pull_request:
    paths:
      - 'eak/kernel/**'
      - 'eak/providers/**'
      - 'eak/domains/**'
      - '.github/workflows/eak-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-and-sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install audited EAK environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './eak/kernel[langgraph,security,observability]'
          python -m pip install -e './eak/providers'
          python -m pip install -e './eak/domains/medical'
          python -m pip install 'pip-audit>=2.9,<3'
      - name: Dependency consistency
        run: python -m pip check
      - name: Generate CycloneDX SBOM
        run: python -m pip_audit --progress-spinner=off --format cyclonedx-json --output eak-sbom.json || test -s eak-sbom.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: eak-cyclonedx-sbom
          path: eak-sbom.json
          if-no-files-found: error
      - name: Vulnerability audit gate
        run: python -m pip_audit --progress-spinner=off
