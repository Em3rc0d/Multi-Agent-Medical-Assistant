[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "eak-providers"
version = "0.1.0.dev0"
description = "Provider adapters extracted from Quarry #001 for EAK"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.3,<10"]
docling = ["docling>=2.0"]
qdrant = ["qdrant-client>=1.11"]
tavily = ["tavily-python>=0.5"]
pytorch = ["torch>=2.2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
